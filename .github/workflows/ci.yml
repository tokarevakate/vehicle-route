name: CI

on:
  push:
    branches: [main, feat/model-maturity-dp-mpc]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r webapp/requirements.txt -r requirements-dev.txt
      - run: ruff check webapp tests
      - run: pytest
