<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Vehicle Route Fuel Optimization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4QZ8JpEe7xbqh6HwPp3lGaUyGkSgFvZ8CgtGJWSJ04="
      crossorigin=""
    />
    <link rel="stylesheet" href="/static/style.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="layout">
      <div id="map-container">
        <div id="map"></div>
      </div>
      <div id="sidebar">
        <h2>Параметры движения</h2>

        <div class="metric">
          <span>Время в пути:</span>
          <span id="metric-time">–</span>
        </div>
        <div class="metric">
          <span>Пройденный путь:</span>
          <span id="metric-distance">–</span>
        </div>
        <div class="metric">
          <span>Уклон:</span>
          <span id="metric-grade">–</span>
        </div>

        <!-- Полудуговой gauge оптимальной скорости -->
        <h3>Оптимальная скорость</h3>
        <div id="gauge-container">
          <svg id="gauge-svg" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
            <!-- Фоновая дуга -->
            <path id="gauge-bg" d="" fill="none" stroke="#e0e0e0" stroke-width="14" stroke-linecap="round"/>
            <!-- Цветная дуга значения -->
            <path id="gauge-arc" d="" fill="none" stroke="#437a22" stroke-width="14" stroke-linecap="round"/>
            <!-- Цифра скорости -->
            <text id="gauge-value" x="100" y="100" text-anchor="middle" font-size="28" font-weight="700" fill="#28251d">0</text>
            <text x="100" y="118" text-anchor="middle" font-size="11" fill="#7a7974">км/ч</text>
          </svg>
        </div>

        <!-- Объединённый график высота + уклон -->
        <h3>Профиль маршрута</h3>
        <div id="chart-wrapper">
          <canvas id="chart-combined"></canvas>
        </div>

        <!-- Транспортная панель -->
        <div class="transport">
          <div class="transport-row">
            <input type="range" id="progress-slider" min="0" value="0" step="1" />
          </div>
          <div class="transport-row transport-btns">
            <button id="btn-rewind" title="В начало">⏮</button>
            <button id="btn-back" title="-10 точек">◀◀</button>
            <button id="btn-playpause" title="Старт/Пауза">▶</button>
            <button id="btn-forward" title="+10 точек">▶▶</button>
            <span class="speed-label">Скорость:</span>
            <button class="speed-btn active" data-speed="1">1×</button>
            <button class="speed-btn" data-speed="0.5">0.5×</button>
            <button class="speed-btn" data-speed="2">2×</button>
            <button class="speed-btn" data-speed="4">4×</button>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
